name: CI

on: [push]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Static analysis (phpstan level 9)
        run: composer phpstan

      - name: Unit tests (no WordPress needed)
        run: composer test-unit

      - name: Behavior ID trace
        run: composer test-trace

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, mysqli
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Start wp-env (multisite)
        run: npx @wordpress/env start

      - name: Integration + unit tests (wp-env, multisite)
        run: composer test

      - name: Executable BDD journeys
        run: composer test-bdd -- --format=progress

      - name: Stop wp-env
        if: always()
        run: npx @wordpress/env stop

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, mysqli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:start
      - run: npm run browser:seed
      - run: npm run test:browser
      - name: Stop isolated browser environment
        if: always()
        run: npm run browser:stop

  build:
    needs: [quality, test, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, mysqli
          coverage: none

      - name: Install runtime dependencies (bundled SAML library)
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Prepare for production
        run: |
          rm .gitignore
          mv .deploy.gitignore .gitignore
          rm -rf .github
          rm -rf .idea
          rm -rf .vscode
          rm -rf bin
          rm -rf build
          rm -rf tests
          rm -rf docs
          rm -rf .agents .claude agent
          rm skills-lock.json
          rm AGENTS.md CLAUDE.md CHANGELOG.md
          rm phpunit.xml.dist
          rm phpstan.neon.dist
          rm .wp-env.json
          rm behat.dist.php package.json package-lock.json

      - name: Create a built branch
        run: |
          BRANCH_NAME=$(echo $GITHUB_REF | grep -oP '(?<=refs\/heads\/).*')
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Action CI"
          git remote set-url origin https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git
          git checkout -b $BRANCH_NAME-built
          git add -A && git commit -m "built from $GITHUB_SHA"
          git push --force -u origin $BRANCH_NAME-built
